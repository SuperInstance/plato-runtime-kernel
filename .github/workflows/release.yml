name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --all-features
      - name: Confirm the crate is actually on crates.io
        # `cargo publish` exiting 0 is a claim, not a receipt.
        run: |
          name=$(sed -n 's/^name *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          for attempt in $(seq 1 10); do
            if curl -fsS "https://crates.io/api/v1/crates/$name/$version" >/dev/null; then
              echo "$name $version is on crates.io"
              exit 0
            fi
            echo "not visible yet (attempt $attempt/10)"
            sleep 15
          done
          echo "::error::$name $version is not on crates.io after a successful publish"
          exit 1
      - name: Create GitHub Release
        # Gated on the publish step's OUTCOME. This was unconditional, so a missing or wrong
        # CARGO_REGISTRY_TOKEN produced a green job, no publish, and a GitHub Release
        # pointing at a version that was never distributed.
        if: steps.publish.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
