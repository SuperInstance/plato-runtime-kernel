name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --all-features

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-features -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  release-invariant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A release must not be published for an artefact that was not published
        run: |
          set -uo pipefail
          fail=0
          if grep -q 'continue-on-error: true' .github/workflows/release.yml; then
            echo "::error::release.yml swallows a publish failure with continue-on-error"
            fail=1
          fi
          # -A8, not -A3: the gate is allowed to sit behind explanatory comments.
          if ! grep -A8 'name: Create GitHub Release' .github/workflows/release.yml \
               | grep -q 'steps.publish.outcome'; then
            echo "::error::Create GitHub Release must be gated on steps.publish.outcome"
            fail=1
          fi
          exit $fail
